<!doctype html><html lang="fr"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>Mes Animaux</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fc;color:#172033;font-family:Arial,sans-serif}header{padding:22px 18px 8px;display:flex;align-items:center;justify-content:space-between}h1{font-size:28px;margin:0;font-weight:800}.sub{color:#68738a;margin-top:5px;font-size:14px}.langs{display:flex;gap:5px}.lang{border:0;background:#fff;border-radius:14px;padding:8px 9px;font-weight:700;color:#5b6579}.lang.active{background:#5b7cfa;color:#fff}.grid{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#fff;border-radius:24px;padding:16px;text-align:center;box-shadow:0 5px 18px rgba(30,45,80,.08);transition:transform .12s,box-shadow .12s}.card:active{transform:scale(.94);box-shadow:0 2px 8px rgba(30,45,80,.12)}.animal{font-size:62px;line-height:1.1;margin:6px 0 8px}.name{font-weight:800;font-size:18px}.hint{font-size:12px;color:#8a94a8;margin-top:5px}.pulse{animation:pulse .35s ease}@keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.12) rotate(-2deg)}100%{transform:scale(1)}}footer{text-align:center;color:#9aa3b5;font-size:12px;padding:8px 20px 22px}.rtl{direction:rtl}
</style></head><body><header><div><h1 id="title">Mes Animaux</h1><div class="sub" id="sub">Touche un animal pour écouter son son</div></div><div class="langs"><button class="lang active" data-l="fr">FR</button><button class="lang" data-l="en">EN</button><button class="lang" data-l="ar">ع</button></div></header><main class="grid" id="grid"></main><footer id="foot">Fonctionne hors connexion • Aucun compte</footer>
<script>
const data=[
 ['🐶',{fr:'Chien',en:'Dog',ar:'كلب'},'dog'],['🐱',{fr:'Chat',en:'Cat',ar:'قط'},'cat'],['🐮',{fr:'Vache',en:'Cow',ar:'بقرة'},'cow'],['🐷',{fr:'Cochon',en:'Pig',ar:'خنزير'},'pig'],['🐔',{fr:'Poule',en:'Hen',ar:'دجاجة'},'hen'],['🐑',{fr:'Mouton',en:'Sheep',ar:'خروف'},'sheep'],['🐴',{fr:'Cheval',en:'Horse',ar:'حصان'},'horse'],['🦁',{fr:'Lion',en:'Lion',ar:'أسد'},'lion'],['🐘',{fr:'Éléphant',en:'Elephant',ar:'فيل'},'elephant'],['🐵',{fr:'Singe',en:'Monkey',ar:'قرد'},'monkey'],['🐸',{fr:'Grenouille',en:'Frog',ar:'ضفدع'},'frog'],['🐦',{fr:'Oiseau',en:'Bird',ar:'طائر'},'bird']
];
const ui={fr:{title:'Mes Animaux',sub:'Touche un animal pour écouter son son',foot:'Fonctionne hors connexion • Aucun compte'},en:{title:'My Animals',sub:'Tap an animal to hear its sound',foot:'Works offline • No account'},ar:{title:'حيواناتي',sub:'اضغط على الحيوان لسماع صوته',foot:'يعمل دون إنترنت • بدون حساب'}};
let lang=localStorage.lang||'fr';
function render(){document.documentElement.lang=lang;document.body.classList.toggle('rtl',lang==='ar');document.getElementById('title').textContent=ui[lang].title;document.getElementById('sub').textContent=ui[lang].sub;document.getElementById('foot').textContent=ui[lang].foot;document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));document.getElementById('grid').innerHTML=data.map((a,i)=>`<button class="card" aria-label="${a[1][lang]}" onclick="play(this,'${a[2]}')"><div class="animal">${a[0]}</div><div class="name">${a[1][lang]}</div><div class="hint">▶</div></button>`).join('')}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.l;localStorage.lang=lang;render()});
function play(el,type){el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse');let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let c=new C(),o=c.createOscillator(),g=c.createGain();let now=c.currentTime;let f={dog:[420,260,0.16],cat:[650,480,0.22],cow:[180,130,0.55],pig:[330,250,0.25],hen:[800,1200,0.18],sheep:[500,380,0.35],horse:[280,190,0.3],lion:[120,90,0.7],elephant:[220,110,0.5],monkey:[520,760,0.22],frog:[300,180,0.28],bird:[1100,1500,0.2]}[type]||[440,660,.2];o.type='sine';o.frequency.setValueAtTime(f[0],now);o.frequency.exponentialRampToValueAtTime(f[1],now+f[2]);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(.25,now+.02);g.gain.exponentialRampToValueAtTime(.001,now+f[2]);o.connect(g);g.connect(c.destination);o.start(now);o.stop(now+f[2]+.03);setTimeout(()=>c.close(),500)}
render();
</script></body></html>
